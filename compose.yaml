name: amfot

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-php-common: &php-common
  image: ${PHP_IMAGE:?set a verified runtime with pcntl in .env}
  working_dir: /var/www/html
  restart: unless-stopped
  logging: *logging
  # Laravel reads its mounted .env (or config cache), including under cron.
  # Do not inject a second, stale copy of application secrets into containers.
  environment:
    QUEUE_WORKER_TIMEOUT: ${QUEUE_WORKER_TIMEOUT:-60}
  volumes:
    - ./app:/var/www/html
    - ./deploy:/opt/amfot:ro
  networks: [internal]
  depends_on:
    db:
      condition: service_healthy
    init:
      condition: service_completed_successfully

services:
  init:
    image: ${PHP_IMAGE:?set a verified runtime with pcntl in .env}
    working_dir: /var/www/html
    restart: "no"
    logging: *logging
    command: ["sh", "/opt/amfot/init-storage.sh"]
    volumes:
      - ./app:/var/www/html
      - ./deploy/init-storage.sh:/opt/amfot/init-storage.sh:ro
    networks: [internal]

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    volumes:
      - ./app:/var/www/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [internal]

  app:
    <<: *php-common
    command: ["php-fpm", "-F"]
    healthcheck:
      test: ["CMD", "su", "-s", "/bin/sh", "www-data", "-c", "php /opt/amfot/check-runtime.php"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  worker:
    <<: *php-common
    user: www-data
    command: ["sh", "/opt/amfot/worker.sh"]
    stop_grace_period: 360s

  scheduler:
    <<: *php-common
    command: ["cron", "-f"]

  db:
    image: mysql:8.4
    restart: unless-stopped
    logging: *logging
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?set in .env}"
      MYSQL_DATABASE: amfot
      MYSQL_USER: amfot
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?set in .env}"
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -u root --silent']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [internal]

volumes:
  mysql_data:

networks:
  internal:
    driver: bridge
